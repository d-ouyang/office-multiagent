# office-multiagent · 本地 Docker 联动
# 服务：mysql / redis / chroma / backend / frontend，同处 office-net。
# 启动：docker compose up -d --build   （首次拉镜像+构建后端较重，属耗时操作，按立项纪律不自动跑）

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office}
      MYSQL_USER: ${MYSQL_USER:-office}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-office_pass}
    # 不发布宿主端口：避开与 RAG(rag-mysql 3306) 冲突；backend 经 office-net 服务名访问（设计 §12.3 容器独立）
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [office-net]

  redis:
    image: redis:7-alpine
    # 不发布宿主端口：避开与 RAG(rag-redis 6379) 冲突；backend 经 office-net 服务名访问
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [office-net]

  chroma:
    image: chromadb/chroma:0.5.23   # pin 版本；亦可复用共享 RAG 的 Chroma（设计文档 §12.3）
    # 不发布宿主端口：避开与 RAG(rag-chroma 8001) 冲突；backend 经 office-net 服务名访问
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [office-net]

  backend:
    build: ./backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-office}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-office_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      REQUIRE_CHROMA: "false"
      # 云端模型密钥（p5.1a Brain 真调用；从根 .env 注入，不入镜像不入仓）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      # JWT_SECRET：与网关 GATEWAY_JWT_SECRET 同值（后端二次验签取身份，p6.2c）
      JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      # RAG 检索工具（容器内 127.0.0.1 是自己，必须走宿主打到 RAG FastAPI）
      RAG_BASE_URL: ${RAG_BASE_URL:-http://host.docker.internal:8000}
    # 不发布宿主端口：①避开与 RAG 宿主进程(FastAPI 127.0.0.1:8000)冲突；②设计 §13.3 后端只内网可达，网关才是入口
    volumes:
      - ./backend/data:/app/data:ro   # 文档目录（read_document 工具只读）
      - ./backend/config:/app/config:ro   # 配置热更：models/planner/agents yaml 改完 recreate 即生效，无需重建镜像
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [office-net]

  gateway:
    build: ./gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 3000
      # 与后端 JWT_SECRET / INTERNAL_SHARED_SECRET 同值；开发可留空（JWT 随机生成、内部调用不可用）
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}
      GATEWAY_BACKEND_URL: http://backend:8000
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:8080}
      GATEWAY_PROXY_TIMEOUT_MS: ${GATEWAY_PROXY_TIMEOUT_MS:-180000}
      # 共享网关（p5.0）：RAG 上游 + 限流
      RAG_BACKEND_URL: ${RAG_BACKEND_URL:-http://host.docker.internal:8000}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:-}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-600}
      GATEWAY_RATE_LIMIT_WINDOW_MS: ${GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}
      # 登录用户源（p6.1）：office MySQL 的 user 表
      GATEWAY_MYSQL_HOST: mysql
      GATEWAY_MYSQL_PORT: "3306"
      GATEWAY_MYSQL_USER: ${MYSQL_USER:-office}
      GATEWAY_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-office_pass}
      GATEWAY_MYSQL_DATABASE: ${MYSQL_DATABASE:-office}
    ports:
      - "3001:3000"   # 宿主 3001，避开 RAG 宿主网关占用的 3000；前端 nginx 走容器网络 gateway:3000 不受影响
    depends_on:
      - backend
    networks: [office-net]

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - gateway
    networks: [office-net]

networks:
  office-net:
    driver: bridge

volumes:
  mysql_data:
  chroma_data:
