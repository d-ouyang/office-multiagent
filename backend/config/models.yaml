# =====================================================================
# 模型注册表（配置驱动，非硬编码）—— 设计文档 §十七 + 用户点6
#
# 两类模型：
#   1) in_dialogue: true  → 出现在对话模型下拉（用户凭 model_pool 权限可见）
#   2) in_dialogue: false → 仅在后端逻辑中使用（embedding / reranker / decision），
#                          不进对话列表；role 标注用途。
#
# 所有模型全部云端（用户持有 SiliconFlow / DeepSeek key），无本地部署。
# 密钥不写本文件，只写环境变量名（api_key_env），运行时从环境变量读取。
# =====================================================================

llm_providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  siliconflow:
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY

models:
  # ---------- 对话用大模型（云端，进下拉；前端按 provider 分组：DeepSeek 官方 / 硅基流动） ----------
  # DeepSeek 官方渠道（api.deepseek.com，走 DEEPSEEK_API_KEY 余额）
  - id: deepseek-chat
    name: DeepSeek V3
    provider: deepseek
    in_dialogue: true
    multimodal_input: false
    context_window: 128000
    max_output: 8192
    supports_reasoning: false
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.001
    api_model: deepseek-chat
    description: DeepSeek 官方 V3，通用对话与工具调用，速度快（默认模型）

  - id: deepseek-reasoner
    name: DeepSeek R1
    provider: deepseek
    in_dialogue: true
    multimodal_input: false
    context_window: 128000
    max_output: 8192
    supports_reasoning: true
    pool_ids: [staff, admin]
    cost_per_1k: 0.005
    api_model: deepseek-reasoner
    description: DeepSeek 官方 R1 深度推理，适合复杂分析（较慢）

  # 硅基流动渠道（api.siliconflow.cn，走 SILICONFLOW_API_KEY 余额，与官方额度独立）
  - id: deepseek-v3-sf
    name: DeepSeek V3
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 163840
    max_output: 8192
    supports_reasoning: false
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.001
    api_model: deepseek-ai/DeepSeek-V3
    description: DeepSeek V3（硅基流动渠道），与官方额度独立互为备份

  - id: deepseek-r1-sf
    name: DeepSeek R1
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 163840
    max_output: 16384
    supports_reasoning: true
    pool_ids: [staff, admin]
    cost_per_1k: 0.002
    api_model: deepseek-ai/DeepSeek-R1
    description: DeepSeek R1 深度推理（硅基流动渠道）

  - id: deepseek-v4.1-flash-sf
    name: DeepSeek V4.1-Flash
    provider: siliconflow
    in_dialogue: true
    multimodal_input: true
    context_window: 1048576
    max_output: 16384
    supports_reasoning: true
    reasoning_efforts: [low, high, max]
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.002
    api_model: deepseek-ai/DeepSeek-V4.1-Flash
    description: 多模态混合专家模型，原生支持图像与文本，1M 上下文，擅长编程/深度推理/智能体

  - id: deepseek-v4-flash-sf
    name: DeepSeek V4-Flash
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 1048576
    max_output: 16384
    supports_reasoning: true
    reasoning_efforts: [high, max]
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.001
    api_model: deepseek-ai/DeepSeek-V4-Flash
    description: V4 系轻量 Flash 版，1M 上下文，速度快成本低，支持思考与工具调用

  - id: glm-5.3-flash-sf
    name: GLM-5.3-Flash
    provider: siliconflow
    in_dialogue: true
    multimodal_input: true
    context_window: 1048576
    max_output: 8192
    supports_reasoning: true
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.0005
    api_model: zai-org/GLM-5.3-Flash
    description: 智谱 GLM-5.3 Flash，支持思考与视觉，1M 上下文，适合通用对话与轻量任务

  - id: qwen3.5-9b-sf
    name: Qwen3.5-9B
    provider: siliconflow
    in_dialogue: true
    multimodal_input: true
    context_window: 262144
    max_output: 8192
    supports_reasoning: true
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.0002
    api_model: Qwen/Qwen3.5-9B
    description: 通义千问 3.5 9B，256K 上下文，支持思考与视觉

  - id: longcat-2.0-sf
    name: LongCat-2.0
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 1048576
    max_output: 16384
    supports_reasoning: true
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.02
    api_model: meituan-longcat/LongCat-2.0
    description: 美团 LongCat-2.0，1M 上下文，支持思考

  - id: hy4-preview-sf
    name: Hy4-preview
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 1048576
    max_output: 65536
    supports_reasoning: true
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.018
    api_model: tencent/Hy4-preview
    description: 腾讯混元 Hy4 preview，1M 上下文，支持思考

  - id: deepseek-v4-pro-sf
    name: DeepSeek V4-Pro
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 1048576
    max_output: 16384
    supports_reasoning: true
    reasoning_efforts: [high, max]
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.024
    api_model: deepseek-ai/DeepSeek-V4-Pro
    description: DeepSeek V4 旗舰，1M 上下文，支持思考与工具调用

  - id: qwen3.8-27b-sf
    name: Qwen3.8-27B
    provider: siliconflow
    in_dialogue: true
    multimodal_input: true
    context_window: 262144
    max_output: 16384
    supports_reasoning: true
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.012
    api_model: Qwen/Qwen3.8-27B
    description: 通义千问 3.8 27B，256K 上下文，默认思考，支持视觉

  # ---------- 逻辑用小模型（云端，不进对话列表） ----------
  - id: bge-m3
    name: BGE-M3 Embedding
    provider: siliconflow
    in_dialogue: false
    role: embedding
    api_model: BAAI/bge-m3
    api_key_env: SILICONFLOW_API_KEY

  - id: bge-reranker-v2-m3
    name: BGE Reranker v2-m3
    provider: siliconflow
    in_dialogue: false
    role: reranker
    api_model: BAAI/bge-reranker-v2-m3
    api_key_env: SILICONFLOW_API_KEY

  - id: deepseek-ocr
    name: DeepSeek-OCR
    provider: siliconflow
    in_dialogue: false
    role: ocr
    api_model: deepseek-ai/DeepSeek-OCR
    api_key_env: SILICONFLOW_API_KEY
    description: 只用于扫描件和图片转文字，不进对话列表。上下文 8K。

  - id: decision-llm
    name: 决策小模型（路由 / 复杂度判断）
    provider: siliconflow
    in_dialogue: false
    role: decision
    api_model: Qwen/Qwen2.5-7B-Instruct
    api_key_env: SILICONFLOW_API_KEY
