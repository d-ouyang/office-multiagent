# =====================================================================
# 模型注册表（配置驱动，非硬编码）—— 设计文档 §十七 + 用户点6
#
# 两类模型：
#   1) in_dialogue: true  → 出现在对话模型下拉（用户凭 model_pool 权限可见）
#   2) in_dialogue: false → 仅在后端逻辑中使用（embedding / reranker / decision），
#                          不进对话列表；role 标注用途。
#
# 所有模型全部云端（用户持有 SiliconFlow / DeepSeek key），无本地部署。
# 密钥不写本文件，只写环境变量名（api_key_env），运行时从环境变量读取。
# =====================================================================

llm_providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  siliconflow:
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY

models:
  # ---------- 对话用大模型（云端，进下拉） ----------
  - id: deepseek-chat
    name: DeepSeek V3
    provider: deepseek
    in_dialogue: true
    multimodal_input: false
    context_window: 128000
    max_output: 8192
    supports_reasoning: false
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.001
    api_model: deepseek-chat

  - id: deepseek-reasoner
    name: DeepSeek R1
    provider: deepseek
    in_dialogue: true
    multimodal_input: false
    context_window: 64000
    max_output: 8192
    supports_reasoning: true
    pool_ids: [staff, admin]
    cost_per_1k: 0.005
    api_model: deepseek-reasoner

  - id: qwen-plus
    name: 通义千问 Plus
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 131072
    max_output: 8192
    supports_reasoning: false
    pool_ids: [default, staff, admin]
    cost_per_1k: 0.0008
    api_model: Qwen/Qwen2.5-72B-Instruct

  - id: glm-4
    name: 智谱 GLM-4
    provider: siliconflow
    in_dialogue: true
    multimodal_input: true
    context_window: 128000
    max_output: 8192
    supports_reasoning: false
    pool_ids: [staff, admin]
    cost_per_1k: 0.001
    api_model: GLM-4

  - id: kimi
    name: Kimi (Moonshot)
    provider: siliconflow
    in_dialogue: true
    multimodal_input: false
    context_window: 200000
    max_output: 8192
    supports_reasoning: false
    pool_ids: [admin]
    cost_per_1k: 0.002
    api_model: moonshot-v1-8k

  # ---------- 逻辑用小模型（云端，不进对话列表） ----------
  - id: bge-m3
    name: BGE-M3 Embedding
    provider: siliconflow
    in_dialogue: false
    role: embedding
    api_model: BAAI/bge-m3
    api_key_env: SILICONFLOW_API_KEY

  - id: bge-reranker-v2-m3
    name: BGE Reranker v2-m3
    provider: siliconflow
    in_dialogue: false
    role: reranker
    api_model: BAAI/bge-reranker-v2-m3
    api_key_env: SILICONFLOW_API_KEY

  - id: decision-llm
    name: 决策小模型（路由 / 复杂度判断）
    provider: siliconflow
    in_dialogue: false
    role: decision
    api_model: Qwen/Qwen2.5-7B-Instruct
    api_key_env: SILICONFLOW_API_KEY
