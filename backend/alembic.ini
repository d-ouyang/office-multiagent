# Alembic 配置（p1.2c）。URL 由 migrations/env.py 用 core.config 的 DATABASE_URL 覆盖，
# 这里只留一个占位默认，保证 `alembic` 命令能起。
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://office:office_pass@mysql:3306/office?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
