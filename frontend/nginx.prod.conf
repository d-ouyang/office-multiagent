# 生产专用 nginx 配置：与 nginx.conf 唯一区别是上游服务名。
# docker-compose.prod.yml 里服务改名为 office-gateway（避免与 RAG 栈的 `backend`/
# `gateway` 服务名在共享网络 rag-qa-system_default 上发生 DNS 别名冲突）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端调后端：/api/* 反代到 office-gateway 容器，由网关做鉴权 + NDJSON 透传
    location /api/ {
        proxy_pass http://office-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NDJSON 流式不能缓冲（设计文档 §12.1 / §11.8）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # p2.9：带内容 hash 的静态资源 → 长缓存（immutable：内容变 = 文件名变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # p2.9：index.html 禁缓存——部署后浏览器普通刷新就能拿到新包。
    # （此前无此头：浏览器缓存旧 index.html → 引用旧 JS，用户看到"修复没生效"）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 兜底
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
