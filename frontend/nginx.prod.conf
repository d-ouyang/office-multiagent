# 生产专用 nginx 配置：与 nginx.conf 唯一区别是上游服务名。
# docker-compose.prod.yml 里服务改名为 office-gateway（避免与 RAG 栈的 `backend`/
# `gateway` 服务名在共享网络 rag-qa-system_default 上发生 DNS 别名冲突）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端调后端：/api/* 反代到 office-gateway 容器，由网关做鉴权 + NDJSON 透传
    location /api/ {
        proxy_pass http://office-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NDJSON 流式不能缓冲（设计文档 §12.1 / §11.8）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA 兜底
    location / {
        try_files $uri /index.html;
    }
}
